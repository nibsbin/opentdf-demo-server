##
# Subject Mappings - USAF Refueling Scenario
##
subject_mappings:
  metadata:
    table_name: subject_mappings
    columns:
      - id
      - attribute_value_id
      - subject_condition_set_id
  data:
    # Flight ID RCH2532101 mapping
    subject_mapping_flight_rch2532101:
      id: 812fab35-9aa4-4e73-bf22-c96638d58ea4
      attribute_value_id: 74babca6-016f-4f3e-a99b-4e46ea8d0fd8
      subject_condition_set_id: b3903282-06f9-41a4-924a-7b8eb43dffe0

    # Flight ID RCH2532102 mapping
    subject_mapping_flight_rch2532102:
      id: e6a3f940-e24f-4383-8763-718a1a304948
      attribute_value_id: 2fe8dea1-3555-498c-afe9-99724f35f3d3
      subject_condition_set_id: 798aacd2-abaf-4623-975e-3bb8ca43e318

    # Classification top-secret-fictional mapping
    subject_mapping_classification_ts:
      id: 9d06c757-06b9-4713-8fbd-5ef007b1afe2
      attribute_value_id: 0fd363db-27b1-4210-b77b-8c82fe044d41
      subject_condition_set_id: eaf866c0-327f-4826-846a-5041c3c22f06

    # Classification secret-fictional mapping
    subject_mapping_classification_secret:
      id: 3c623ede-df88-4906-8a78-ebdfacadcd57
      attribute_value_id: 81f643f8-e050-4b97-a005-b61294d4c8bb
      subject_condition_set_id: a7b8c9d0-1234-5678-90ab-cdef12345678

    # Functional maintenance mapping
    subject_mapping_functional_maintenance:
      id: 1b9508a7-746a-4705-a1f1-4b6e676377ce
      attribute_value_id: 532e5957-28f7-466d-91e2-493e9431cd83
      subject_condition_set_id: cf17ec4c-d206-4b74-b3db-5ce07d6995cc

subject_condition_set:
  metadata:
    table_name: subject_condition_set
    columns:
      - id
      - condition
  data:
    # Flight ID RCH2532101 condition - matches users with flight_id claim containing RCH2532101
    subject_condition_flight_rch2532101:
      id: b3903282-06f9-41a4-924a-7b8eb43dffe0
      condition:
        subjectSets:
          - conditionGroups:
              - booleanOperator: CONDITION_BOOLEAN_TYPE_ENUM_OR
                conditions:
                  - subjectExternalSelectorValue: ".flight_id[]"
                    operator: SUBJECT_MAPPING_OPERATOR_ENUM_IN
                    subjectExternalValues:
                      - RCH2532101

    # Flight ID RCH2532102 condition - matches users with flight_id claim containing RCH2532102
    subject_condition_flight_rch2532102:
      id: 798aacd2-abaf-4623-975e-3bb8ca43e318
      condition:
        subjectSets:
          - conditionGroups:
              - booleanOperator: CONDITION_BOOLEAN_TYPE_ENUM_OR
                conditions:
                  - subjectExternalSelectorValue: ".flight_id[]"
                    operator: SUBJECT_MAPPING_OPERATOR_ENUM_IN
                    subjectExternalValues:
                      - RCH2532102

    # Classification top-secret-fictional condition
    subject_condition_classification_ts:
      id: eaf866c0-327f-4826-846a-5041c3c22f06
      condition:
        subjectSets:
          - conditionGroups:
              - booleanOperator: CONDITION_BOOLEAN_TYPE_ENUM_OR
                conditions:
                  - subjectExternalSelectorValue: ".classification[]"
                    operator: SUBJECT_MAPPING_OPERATOR_ENUM_IN
                    subjectExternalValues:
                      - top-secret-fictional

    # Classification secret-fictional condition
    subject_condition_classification_secret:
      id: a7b8c9d0-1234-5678-90ab-cdef12345678
      condition:
        subjectSets:
          - conditionGroups:
              - booleanOperator: CONDITION_BOOLEAN_TYPE_ENUM_OR
                conditions:
                  - subjectExternalSelectorValue: ".classification[]"
                    operator: SUBJECT_MAPPING_OPERATOR_ENUM_IN
                    subjectExternalValues:
                      - secret-fictional

    # Functional maintenance condition
    subject_condition_functional_maintenance:
      id: cf17ec4c-d206-4b74-b3db-5ce07d6995cc
      condition:
        subjectSets:
          - conditionGroups:
              - booleanOperator: CONDITION_BOOLEAN_TYPE_ENUM_OR
                conditions:
                  - subjectExternalSelectorValue: ".functional[]"
                    operator: SUBJECT_MAPPING_OPERATOR_ENUM_IN
                    subjectExternalValues:
                      - maintenance


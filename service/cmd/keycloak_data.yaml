baseUrl: &baseUrl http://localhost:8888
serverBaseUrl: &serverBaseUrl http://localhost:8080
customAudMapper: &customAudMapper
  name: audience-mapper
  protocol: openid-connect
  protocolMapper: oidc-audience-mapper
  config:
    included.custom.audience: *serverBaseUrl
    access.token.claim: "true"
    id.token.claim: "true"
# Attribute mappers for ABAC
flightIdMapper: &flightIdMapper
  name: flight_id-mapper
  protocol: openid-connect
  protocolMapper: oidc-usermodel-attribute-mapper
  config:
    user.attribute: flight_id
    claim.name: flight_id
    jsonType.label: String
    multivalued: "true"
    aggregate.attrs: "true"
    id.token.claim: "true"
    access.token.claim: "true"
    userinfo.token.claim: "true"
classificationMapper: &classificationMapper
  name: classification-mapper
  protocol: openid-connect
  protocolMapper: oidc-usermodel-attribute-mapper
  config:
    user.attribute: classification
    claim.name: classification
    jsonType.label: String
    multivalued: "true"
    aggregate.attrs: "true"
    id.token.claim: "true"
    access.token.claim: "true"
    userinfo.token.claim: "true"
functionalMapper: &functionalMapper
  name: functional-mapper
  protocol: openid-connect
  protocolMapper: oidc-usermodel-attribute-mapper
  config:
    user.attribute: functional
    claim.name: functional
    jsonType.label: String
    multivalued: "true"
    aggregate.attrs: "true"
    id.token.claim: "true"
    access.token.claim: "true"
    userinfo.token.claim: "true"
realms:
  - realm_repepresentation:
      realm: opentdf
      enabled: true
    custom_realm_roles:
      - name: opentdf-admin
      - name: opentdf-standard
    custom_client_roles:
      tdf-entity-resolution:
        - name: entity-resolution-test-role
    custom_groups:
      - name: mygroup
        attributes:
          mygroupattribute:
            - mygroupvalue
    clients:
      - client:
          clientID: opentdf
          enabled: true
          name: opentdf
          serviceAccountsEnabled: true
          clientAuthenticatorType: client-secret
          secret: secret
          protocolMappers:
            - *customAudMapper
        sa_realm_roles:
          - opentdf-admin
        copies: 10
      - client:
          clientID: opentdf-sdk
          enabled: true
          name: opentdf-sdk
          serviceAccountsEnabled: true
          clientAuthenticatorType: client-secret
          secret: secret
          protocolMappers:
            - *customAudMapper
        sa_realm_roles:
          - opentdf-standard
      - client:
          clientID: tdf-entity-resolution
          enabled: true
          name: tdf-entity-resolution
          serviceAccountsEnabled: true
          clientAuthenticatorType: client-secret
          secret: secret
          protocolMappers:
            - *customAudMapper
        sa_client_roles:
          realm-management:
            - view-clients
            - query-clients
            - view-users
            - query-users
      - client:
          clientID: tdf-authorization-svc
          enabled: true
          name: tdf-authorization-svc
          serviceAccountsEnabled: true
          clientAuthenticatorType: client-secret
          secret: secret
          protocolMappers:
            - *customAudMapper
      - client:
          clientID: cli-client
          enabled: true
          name: cli-client
          serviceAccountsEnabled: false
          publicClient: true
          redirectUris:
            - 'http://localhost:*'
          protocolMappers:
            - *customAudMapper
      # USAF Refueling Scenario - Service Account Clients
      # Col Ashley Nies - Wing Commander (Full Access)
